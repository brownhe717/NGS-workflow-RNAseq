# sample and sequencing unit sheets ---------------------------------------------------------
samples: config/samples.tsv
units: config/units.tsv

# optional inclusion of certain rules -------------------------------------------------------
mergeReads:
  activate: False

# chromosome filtering ----------------------------------------------------------------------
filter_chroms: True
keep_chroms: config/keep_chroms.txt

# standard dm6 reference options ------------------------------------------------------------
# Kept for the original dm6-only RNA-seq workflow/rules.
ref_genome:
  name: dm6
  link: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/215/GCF_000001215.4_Release_6_plus_ISO1_MT/GCF_000001215.4_Release_6_plus_ISO1_MT_genomic.fna.gz

ref_annotation:
  name: flybase_dm6
  link: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/215/GCF_000001215.4_Release_6_plus_ISO1_MT/GCF_000001215.4_Release_6_plus_ISO1_MT_genomic.gtf.gz

# concatenated mel/sim reference for hybrid ASE --------------------------------------------
# These files are expected to be prebuilt manually before running Snakemake.
ref_concat:
  activate: True

  genome:
    name: mel_sim_concat
    fasta: resources/mel_sim_concat/mel_sim_concat.fa

  annotation:
    name: mel_sim_concat_gtf
    gtf: resources/mel_sim_concat/mel_sim_concat.gtf

  # Will be generated by hisat2_index_concat rule in hybrid_ase.smk.
  hisat2_index:
    prefix: resources/mel_sim_concat/hisat2_index/mel_sim_concat

# hybrid allele-specific expression settings ------------------------------------------------
hybrid_ase:
  activate: True

  # HISAT2 multimapping behavior.
  # If keep_multimappers is True, hisat2_align_concat adds -k hisat2_k.
  keep_multimappers: True
  hisat2_k: 10

  # Optional unique-only BAM branch.
  # This creates separate BAMs for stricter gene-level ASE/cis-trans analyses.
  make_unique_bams: True
  unique_filter_method: NH
  unique_bam_min_mapq: 20

  # featureCounts multimapper behavior.
  # Used for TE/repeat/pericentromeric analyses from the multimapper-inclusive BAMs.
  featurecounts_multimappers: True
  featurecounts_fraction: True

  # diagnostic SNP filtering.
  # Each parent must have at least this many reads at a site for it to be retained.
  min_snp_depth: 10

  # Future toggle for strict SNP-based ASE workflows.
  # Current concat-based workflow already uses unique-only BAMs
  # for diagnostic SNP and ASE-related steps.
  unique_only_ase: False

# spike-in genome options -------------------------------------------------------------------
use_spikeIn: False

spikeIn_genome:
  name: yeast_w303
  link: http://sgd-archive.yeastgenome.org/sequence/strains/W303/W303_SGD_2015_JRIU00000000/W303_SGD_2015_JRIU00000000.fsa.gz

# DESeq2 options ----------------------------------------------------------------------------
# Keep FALSE for now. The hybrid-vs-synthetic contrast is included for later,
# after we add a rule that creates synthetic-control count columns.
run_diff_exp: False

diff_exp:
  experiments:
    Hybrid_RNAseq:
      contrasts:
        hybrid-vs-synthetic:
          - Hybrid_experimental
          - synthetic
  model: ~condition
  count_threshold: 50
  padj_cutoff: 0.05
  log2FC_cutoff: 1

# rule parameters ---------------------------------------------------------------------------
params:
  hisat2_index: ""

  hisat2_align: "--very-sensitive --no-mixed --no-discordant"

  filter_multireads: "-f bam -F '(mapping_quality >= 0)'"

  featurecounts_unique: "-p"
  featurecounts_multi: "-p -M --fraction"

  bigwigs_ind: "--binSize 10"
  bigwigs_merged: "--binSize 10"